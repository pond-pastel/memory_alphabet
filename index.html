<body>
    <!--Ver.3.0.0-->
    <script src="memory_alphabet.js"></script>
    <div class="settings">
        <h1>Memory Alphabet</h1>
        <div id="effect-group"></div>
        <div class="normal-mode-content">
            答えるアルファベット
            <input id="count" type="range" value="2" min="2" max="10" step="1">
            <span id="show-count">2</span>個前
        </div>
        <div class="flash-mode-content">
            覚えるアルファベット
            <input id="count-of-alphabet" type="number" value="2" min="2">個
        </div>
        <div>
            表示形式
            <select id="letter">
                <option value="lowercase">小文字</option>
                <option value="uppercase" selected>大文字</option>
            </select>
        </div>
        <div>
            モード
            <select id="mode">
                <option value="normal" selected>普通</option>
                <option value="flash">メモリー</option>
            </select>
        </div>
        <div>
            操作方法
            <select id="how-to-operate">
                <option value="keyboard" selected>キーボード</option>
                <option value="touch">タッチ</option>
            </select>
        </div>
        <div id="high-score" class="normal-mode-content"></div>
        <div id="flash-high-score-record" class="flash-mode-content">ハイスコア: 記録がありません。</div>
        <p>
            <span id="rules"></span>
        </p>
        <div class="center">
            <div class="center keyboard">
                <span class="space-bar start"></span>を押してスタート
            </div>
            <span class="touch start" style="display: none;">スタート</span>
        </div>
    </div>
    <div class="playing" style="display: none;">
        <div class="key" id="alphabet">
            <span class="alphabet" id="alphabet-area"></span>
        </div>
        <div id="choices-box">
            <div id="choices"></div>
        </div>
        <div>
            <span id="heart"></span>
        </div>
        <div class="center" id="next">
            <div class="center keyboard">
                <span class="space-bar next"></span>で次へ
            </div>
            <span class="touch next" style="display: none;">次へ</span>
        </div>
        <div class="center" id="question" style="display: none;">
            <span id="question-count"></span>つ前のアルファベットは？
        </div>
    </div>
    <div id="flash-input" style="display: none;">
        <h2 class="text-center">出てきたアルファベットを順番に選んでください。</h2>
        <div id="flash-answer"></div>
    </div>
    <div class="result" style="display: none;">
        <div class="center gameover">Game Over</div>
        <p class="score">Score: <span id="current-score-result"></span></p>
        <p class="score" id="high-score-bg">High Score: <span id="high-score-result"></span></p>
        <h2 class="miss">ミス</h2>
        <div id="miss-group"></div>
        <div class="center">
            <div class="center keyboard">
                <span class="space-bar return"></span>で戻る
            </div>
            <span class="touch return" style="display: none;">戻る</span>
        </div>
    </div>
    <div id="flash-result" style="display: none;">
        <div id="flash-result-title">Game Clear</div>
        <div id="flash-clear" style="display: none;">
            <p class="score" id="flash-score">Score: </p>
            <p class="score" id="flash-high-score">High Score: </p>
        </div>
        <p id="flash-historys"></p>
        <div class="center" id="flash-space-return" style="display: none;">
            <span class="space-bar"></span>で戻る
        </div>
        <div class="center" id="flash-touch-return" style="display: none;">
            <button id="flash-touch-return-button">戻る</button>
        </div>
    </div>
</body>
</html>
